version: 2

sources:
  - name: raw
    schema: gz_raw_data
    
    tables:
      - name: adwords
        identifier: raw_gz_adwords

      - name: bing
        identifier: raw_gz_bing

      - name: criteo
        identifier: raw_gz_criteo

      - name: facebook
        identifier: raw_gz_facebook

      - name: sales
        identifier: raw_gz_sales

      - name: product
        identifier: raw_gz_product
        description: "product infos"
        columns:
          - name: products_id
            tests:
              - unique
              - not_null

      - name: ship
        identifier: raw_gz_ship
        description: "shipping infos"
        columns:
          - name: orders_id
            tests:
              - unique
              - not_null

models:
  - name: int_campaigns
    description: "all datas coming from all tables"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - campaign_key
            - date_date
            
    columns:
      - name: paid_source
        tests:
          - not_null

      - name: campaign_name
        tests:
          - not_null
      
  - name: int_campaigns_day
    description: daily total campaign datas
    columns:
      - name: date_date
        description: date
      - name: ads_cost
        description: total daily advertisement cost
      - name: ads_impression
        description: total daily impression number
      - name: ads_click
        description: total daily click number